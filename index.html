<title>Pegasus 43 Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one 480px column. Fixed-height stack: nav 56, photo 232, title 80, size header 32,
     grid rows of 48 with 8px gaps, sticky bar 72. Sold-out sizes keep their grid cell.
     Type: one family (Inter), four sizes: 24 / 16 / 14 / 12, on a 4px line-height rhythm.
     Color: two base colors (--bg, --fg). Every grey is a mix of them, so all neutrals share one temperature. */
  :root {
    --bg: #ffffff;
    --fg: #111214;
    --muted: color-mix(in oklab, var(--fg) 62%, var(--bg));
    --line: color-mix(in oklab, var(--fg) 14%, transparent);
    --btn: color-mix(in oklab, var(--fg) 6%, transparent);
    --btn-ring: color-mix(in oklab, var(--fg) 14%, transparent);
    --note-bg: color-mix(in oklab, var(--fg) 6%, transparent);
    --photo-bg: #f5f5f6;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111214;
      --fg: #f3f4f5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111214;
    --fg: #f3f4f5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 20px;
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: var(--bg);
  }
  button { font: inherit; color: inherit; }
  /* Tabular figures only where numbers line up or change. */
  .size, .price, .bag-count, .status, .sheet table { font-variant-numeric: tabular-nums; }
  .page { max-width: 480px; margin: 0 auto; }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* 1. Nav bar, 56px. Icons share one stroke and no bounding shapes. */
  .nav {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    height: 56px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .nav .group { display: flex; align-items: center; }
  .icon-btn {
    position: relative;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  /* Optical edge: the drawn strokes, not the 44px boxes, sit on the 16px gutter. */
  .nav .back { margin-left: -18px; }
  .nav .group:last-child { margin-right: -14px; }
  .bag-count {
    position: absolute;
    top: 6px;
    right: 3px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--fg);
    color: var(--bg);
    font-size: 12px;
    font-weight: 600;
    line-height: 16px;
    text-align: center;
  }
  .bag-count[hidden] { display: none; }

  /* 2. Photo box, 375 x 232, reserved before the image loads */
  .photo {
    width: 100%;
    aspect-ratio: 375 / 232;
    background: var(--photo-bg);
    overflow: hidden;
  }
  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: fade-in 240ms ease-out both;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* 3. Title, price, rating: 80px = 6 + 16 + 28 + 24 + 6. Left edge and right edge are the only lines. */
  .title { height: 80px; padding-top: 6px; padding-bottom: 6px; }
  .meta { height: 16px; margin: 0; font-size: 12px; line-height: 16px; letter-spacing: 0.01em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title h1 { margin: 0; height: 28px; font-size: 24px; font-weight: 700; line-height: 28px; letter-spacing: -0.02em; text-wrap: balance; }
  .price-row { display: flex; justify-content: space-between; align-items: center; height: 24px; }
  .price { font-size: 16px; font-weight: 600; line-height: 24px; }
  .reviews { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; letter-spacing: 0.01em; color: var(--muted); }
  .reviews svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }

  /* 4. Size selector */
  .size-head { height: 32px; display: flex; align-items: center; justify-content: space-between; }
  .size-head h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
  .link-btn { background: none; border: 0; padding: 0 0 0 12px; height: 32px; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 48px;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .size {
    position: relative;
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 8px;
    background: var(--btn);
    box-shadow: inset 0 0 0 1px var(--btn-ring);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
    line-height: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 100ms ease-out;
  }
  .size .w { font-size: 12px; font-weight: 400; letter-spacing: 0.01em; color: var(--muted); }
  .size:active { transform: scale(0.97); }
  .size[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
  .size .check { display: none; position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); }
  .size .check svg { display: block; width: 14px; height: 14px; fill: none; stroke: var(--bg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .size[aria-pressed="true"] .check { display: block; }
  .size.soldout {
    opacity: 0.42;
    background-image: linear-gradient(to top right, transparent calc(50% - 0.75px), var(--fg) calc(50% - 0.75px), var(--fg) calc(50% + 0.75px), transparent calc(50% + 0.75px));
  }
  .size:disabled { cursor: not-allowed; color: var(--fg); }
  .size.soldout:active { transform: none; }
  .grid.shake { animation: shake 360ms ease-in-out; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  .status { min-height: 52px; margin-top: 12px; }
  .status p { margin: 0; padding: 12px; border-radius: 8px; background: var(--note-bg); font-size: 14px; line-height: 20px; text-wrap: pretty; }
  .foot { padding-top: 24px; padding-bottom: calc(72px + 24px + env(safe-area-inset-bottom, 0px)); font-size: 12px; line-height: 16px; letter-spacing: 0.01em; color: var(--muted); text-wrap: pretty; }
  .foot a { color: inherit; }

  /* 5. Sticky bar, 72px */
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    z-index: 20;
    height: calc(72px + env(safe-area-inset-bottom, 0px));
    padding-top: 12px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .cta { width: 100%; height: 48px; border: 0; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600; cursor: pointer; }
  .cta:active { transform: scale(0.99); }

  /* Size guide sheet */
  dialog.sheet { margin: auto 0 0; padding: 0; width: 100%; max-width: 480px; left: 50%; transform: translateX(-50%); border: 0; border-radius: 16px 16px 0 0; background: var(--bg); color: var(--fg); max-height: 78vh; }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.5); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; height: 56px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
  .sheet-head .icon-btn { margin-right: -14px; }
  .sheet-body { max-height: calc(78vh - 56px); overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .sheet th, .sheet td { text-align: right; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sheet th { font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: var(--muted); position: sticky; top: 0; background: var(--bg); }
  .sheet .gone td { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .photo img, .grid.shake { animation: none; }
    .size, .cta { transition: none; }
  }
</style>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head gutter">
    <h2 id="sheetTitle">Size guide</h2>
    <button class="icon-btn" type="button" id="sheetClose" aria-label="Close size guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body gutter">
    <table>
      <thead><tr><th>Men’s US</th><th>Women’s US</th><th>EU</th></tr></thead>
      <tbody id="guideRows"></tbody>
    </table>
  </div>
</dialog>

<script>
  // Pegasus 43, style HV7521-001. [men's US, women's US, EU, quantity]. Order = display_order.
  // Quantity 0 = sold out (stays in its cell, greyed, disabled). 1 to LOW_STOCK_MAX = low stock.
  var SIZES = [
    [3.5, 5, "35.5", 0], [4, 5.5, "36", 4], [4.5, 6, "36.5", 18], [5, 6.5, "37.5", 26],
    [5.5, 7, "38", 34], [6, 7.5, "38.5", 47], [6.5, 8, "39", 63], [7, 8.5, "40", 88],
    [7.5, 9, "40.5", 112], [8, 9.5, "41", 164], [8.5, 10, "42", 198], [9, 10.5, "42.5", 3],
    [9.5, 11, "43", 2], [10, 11.5, "44", 0], [10.5, 12, "44.5", 212], [11, 12.5, "45", 5],
    [11.5, 13, "45.5", 176], [12, 13.5, "46", 138], [12.5, 14, "47", 84], [13, 14.5, "47.5", 71],
    [13.5, 15, "48", 36], [14, 15.5, "48.5", 29], [14.5, 16, "49", 14], [15, 16.5, "49.5", 1],
    [15.5, 17, "50", 0], [16, 17.5, "50.5", 0]
  ];
  var LOW_STOCK_MAX = 5;

  var grid = document.getElementById("grid");
  var statusEl = document.getElementById("status");
  var cta = document.getElementById("cta");
  var bagCount = document.getElementById("bagCount");
  var sheet = document.getElementById("sheet");
  var selected = null;
  var bag = 0;

  var CHECK = '<span class="check"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.8 7.2l2.2 2.2 4.2-4.4"/></svg></span>';

  function name(s) { return "M " + s[0] + " / W " + s[1]; }
  function setStatus(html) { statusEl.innerHTML = html ? "<p>" + html + "</p>" : ""; }

  SIZES.forEach(function (s, i) {
    var qty = s[3];
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "size" + (qty === 0 ? " soldout" : "");
    b.dataset.index = i;
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", name(s) + (qty === 0 ? ", sold out" : ""));
    if (qty === 0) b.disabled = true;
    b.innerHTML = '<span>M ' + s[0] + '</span><span class="w">W ' + s[1] + '</span>' + CHECK;
    li.appendChild(b);
    grid.appendChild(li);
  });

  grid.addEventListener("click", function (e) {
    var b = e.target.closest(".size");
    if (!b) return;
    var i = Number(b.dataset.index);
    var s = SIZES[i];
    if (s[3] === 0) return; // sold-out buttons are disabled; this is only a safety net
    Array.prototype.forEach.call(grid.querySelectorAll(".size"), function (el) { el.setAttribute("aria-pressed", "false"); });
    b.setAttribute("aria-pressed", "true");
    selected = i;
    setStatus(s[3] <= LOW_STOCK_MAX ? "Only " + s[3] + " left in " + name(s) + "." : "");
  });

  cta.addEventListener("click", function () {
    if (selected === null) {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.getElementById("sizes").scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
      grid.classList.remove("shake");
      void grid.offsetWidth;
      grid.classList.add("shake");
      setStatus("Select a size.");
      return;
    }
    bag += 1;
    bagCount.textContent = bag;
    bagCount.hidden = false;
    setStatus("Added " + name(SIZES[selected]) + " to your bag.");
  });

  var rows = document.getElementById("guideRows");
  SIZES.forEach(function (s) {
    var tr = document.createElement("tr");
    if (s[3] === 0) tr.className = "gone";
    tr.innerHTML = "<td>" + s[0] + "</td><td>" + s[1] + "</td><td>" + s[2] + "</td>";
    rows.appendChild(tr);
  });
  document.getElementById("guideBtn").addEventListener("click", function () { if (sheet.showModal) sheet.showModal(); });
  document.getElementById("sheetClose").addEventListener("click", function () { sheet.close(); });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.close(); });
</script>
